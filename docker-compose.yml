name: parking-app

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: parking-app-api:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/ParkingBooking.db"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=1,connectTimeout=1000,syncTimeout=750,asyncTimeout=750"
      Logging__LogLevel__Parking.Application.Behaviors.CacheBehavior: "Debug"
      Jwt__Issuer: "ParkingService"
      Jwt__Audience: "ParkingService.Client"
      Jwt__ExpiryMinutes: "60"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-}"
      Seed__AdminName: "${SEED_ADMIN_NAME:-Administrator}"
      Seed__DevData: "true"
    volumes:
      - parking-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  parking-data: